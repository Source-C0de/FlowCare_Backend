version: "3.9"

services:
  # Application API
  api:
    build: .
    container_name: flowcare_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    # environment:
    #   - DB_HOST=postgres-db
    #   - DB_PORT=5432
    #   - MINIO_ENDPOINT=minio:9000

    # PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    container_name: flowcare_db_container
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-flowcare_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # MinIO File Storage
  minio:
    image: minio/minio
    container_name: flowcare_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  minio_data:
